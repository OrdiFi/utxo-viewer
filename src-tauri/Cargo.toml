[package]
name = "ordifi-utxo-viewer"
version = "1.0.1"
description = "OrdiFi UTXO Viewer desktop application"
authors = ["Artur Hreczynski <admin@ordifi.io>"]
license = "Apache-2.0"
repository = "https://github.com/OrdiFi/utxo-viewer"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ordifi_utxo_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
